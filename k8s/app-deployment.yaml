# Coliseum en modo servicio (headless) con endpoint /health. La imagen se baja de ghcr.io.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coliseum-app
  labels:
    app: coliseum-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coliseum-app
  template:
    metadata:
      labels:
        app: coliseum-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: coliseum
          image: ghcr.io/rodillaoff/coliseum:latest   # cambiar por tu usuario/organización (en minúsculas)
          imagePullPolicy: IfNotPresent
          args: ["--servicio"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: coliseum-config     # DB_HOST, DB_PORT, DB_NAME, DB_SSL_MODE, APP_PORT
            - secretRef:
                name: coliseum-secret     # DB_USER, DB_PASSWORD (y MYSQL_ROOT_PASSWORD, que la app no usa)
          resources:
            requests: {cpu: "100m", memory: "192Mi"}
            limits: {cpu: "500m", memory: "384Mi"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
