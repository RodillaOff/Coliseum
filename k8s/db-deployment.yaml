# Base de datos PostgreSQL dentro del clúster (para el taller). Datos en un volumen persistente.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coliseum-db-datos
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coliseum-db
  labels:
    app: coliseum-db
spec:
  replicas: 1
  strategy:
    type: Recreate            # un solo PostgreSQL escribiendo en el volumen
  selector:
    matchLabels:
      app: coliseum-db
  template:
    metadata:
      labels:
        app: coliseum-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: coliseum-secret, key: DB_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: coliseum-secret, key: DB_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: coliseum-config, key: DB_NAME}
            - name: PGDATA                       # subcarpeta: el volumen puede traer "lost+found"
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          readinessProbe:           # ¿acepta consultas? recién ahí recibe tráfico
            exec:
              command: ["sh", "-c", "psql -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -c 'SELECT 1' > /dev/null"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:            # ¿el proceso responde? si no, se reinicia el contenedor
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: datos
              mountPath: /var/lib/postgresql/data
            - name: sql-inicial
              mountPath: /docker-entrypoint-initdb.d   # se ejecuta solo la primera vez (volumen vacío)
              readOnly: true
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: coliseum-db-datos
        - name: sql-inicial
          configMap:
            name: coliseum-sql   # kubectl create configmap coliseum-sql --from-file=sql/
