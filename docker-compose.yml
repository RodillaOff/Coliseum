# Levanta la aplicación (modo servicio) y una base PostgreSQL local con un solo comando:
#   cp .env.example .env   (completar valores)   ->   docker compose up --build
# Las tablas y los datos de prueba se cargan solos desde ./sql la primera vez que arranca la base.
services:
  db:
    image: postgres:16-alpine
    container_name: coliseum-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}       # dueño de la base (no hace falta otro usuario "root")
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"                   # para hacer SELECT directos desde tu PC (host 5433)
    volumes:
      - coliseum-datos:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro   # 01-crear-tablas.sql y 02-datos-prueba.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    image: ghcr.io/rodillaoff/coliseum:latest
    container_name: coliseum-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db                     # nombre del servicio de arriba
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: DISABLED           # base local sin SSL; contra Aiven se usa REQUIRED
    ports:
      - "8080:8080"                   # http://localhost:8080/health
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/classes:/app/lib/*", "consola.ConsolaMain", "--health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

volumes:
  coliseum-datos:
