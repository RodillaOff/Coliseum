# Levanta la aplicación (modo servicio) y una base MySQL local con un solo comando:
#   cp .env.example .env   (completar valores)   ->   docker compose up --build
# Las tablas y los datos de prueba se cargan solos desde ./sql la primera vez que arranca la base.
services:
  db:
    image: mysql:8.0
    container_name: coliseum-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}          # no puede ser "root"
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"                   # para hacer SELECT directos desde tu PC (host 3307)
    volumes:
      - coliseum-datos:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro   # 01-crear-tablas.sql y 02-datos-prueba.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    image: ghcr.io/rodillaoff/coliseum:latest
    container_name: coliseum-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db                     # nombre del servicio de arriba
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: DISABLED           # base local sin SSL; contra Aiven se usa REQUIRED
    ports:
      - "8080:8080"                   # http://localhost:8080/health
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/classes:/app/lib/*", "consola.ConsolaMain", "--health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

volumes:
  coliseum-datos:
